# Geode Production Deployment
#
# Optimized for large-scale testing (up to 10M+ nodes single server)
#
# Usage:
#   docker compose -f docker/docker-compose.production.yml up -d
#   docker compose -f docker/docker-compose.production.yml --profile monitoring up -d
#   docker compose -f docker/docker-compose.production.yml down -v

services:
  geode:
    image: geodedb/geode:latest
    container_name: geode-production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: ports intentionally remain bound to 0.0.0.0 -- this is the
    # primary database service and production clients are expected to
    # reach it over the network from other hosts.
    ports:
      - "3141:3141"   # QUIC server
      - "9090:9090"   # Prometheus metrics
    volumes:
      - geode-production-data:/var/lib/geode
      - geode-production-wal:/var/lib/geode/wal
      - geode-production-logs:/var/log/geode
      - ../certs:/certs:ro
    environment:
      - GEODE_LOG_LEVEL=info
      - GEODE_DATA_DIR=/var/lib/geode
      - GOMAXPROCS=16
    command:
      - serve
      - --data-dir=/var/lib/geode
      - --listen=0.0.0.0:3141
      - --log-level=info
      - --page-cache-size=8GB
      - --wal-buffer-size=64MB
      - --max-connections=10000
      - --disable-auth
    healthcheck:
      test: ["CMD", "geode", "query", "--server", "localhost:3141", "--insecure", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 64G
        reservations:
          cpus: '8'
          memory: 32G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    networks:
      - geode-production-network

  # Benchmark runner with production settings
  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.benchmark
    image: geode-benchmark:production
    container_name: geode-production-benchmark
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ../benchmarks:/benchmarks:ro
      - benchmark-production-results:/results
    environment:
      - GEODE_HOST=geode:3141
      - BENCHMARK_DURATION=300
      - BENCHMARK_CONCURRENCY=100
    healthcheck:
      test: ["CMD-SHELL", "grep -q python /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - geode-production-network
    profiles:
      - benchmark

  # Prometheus for production metrics
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: geode-production-prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-production-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - geode-production-network
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:13.3.0
    container_name: geode-production-grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-production-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=geode
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - prometheus
    networks:
      - geode-production-network
    profiles:
      - monitoring

  # Node exporter for host metrics
  # NOTE: node-exporter requires read-only host mounts of /proc, /sys, and /
  # to collect host-level metrics; this is the standard, documented
  # deployment pattern for prometheus/node-exporter (see upstream docs).
  # All mounts below are explicitly read-only (:ro).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: geode-production-node-exporter
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - geode-production-network
    profiles:
      - monitoring

volumes:
  geode-production-data:
    driver: local
  geode-production-wal:
    driver: local
  geode-production-logs:
    driver: local
  benchmark-production-results:
    driver: local
  prometheus-production-data:
    driver: local
  grafana-production-data:
    driver: local

networks:
  geode-production-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
