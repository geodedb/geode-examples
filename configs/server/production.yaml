# Production Geode Configuration
# Optimized for production workloads with security and monitoring enabled
#
# IMPORTANT: Update paths and credentials before deployment
#
# Start with: geode serve --config configs/server/production.yaml

server:
  listen: "0.0.0.0:3141"
  metrics_listen: "0.0.0.0:9090"
  max_connections: 10000
  connection_timeout: "30s"
  idle_timeout: "5m"

storage:
  data_dir: "/var/lib/geode/data"
  wal_dir: "/var/lib/geode/wal"
  page_size: 8192
  # Allocate 50-75% of available RAM
  page_cache_size: "4GB"
  wal_buffer_size: "64MB"
  # Balance durability vs performance
  wal_sync_interval: "100ms"
  compression: "zstd"
  # Enable memory-mapped I/O for performance
  mmap_enabled: true

security:
  # Transparent Data Encryption
  tde_enabled: true
  tde_algorithm: "AES-256-GCM"
  # Key source options: env, file, vault, aws-kms
  tde_key_source: "file"
  tde_key_file: "/certs/tde.key"

  # TLS configuration (required)
  tls_cert_file: "/certs/server.crt"
  tls_key_file: "/certs/server.key"
  tls_min_version: "1.3"

  # Authentication
  auth_enabled: true
  password_policy:
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special: true
    max_age_days: 90

  # Audit logging
  audit_enabled: true
  audit_log_path: "/var/log/geode/audit.log"
  audit_rotation: "daily"
  audit_retention: "90d"
  audit_events:
    - "authentication"
    - "authorization"
    - "query"
    - "schema_change"
    - "admin"

logging:
  level: "warn"
  format: "json"
  output: "/var/log/geode/geode.log"
  rotation: "daily"
  retention: "30d"

monitoring:
  prometheus_enabled: true
  metrics_interval: "15s"
  health_check_interval: "5s"

