# Development Geode Configuration
# Balanced settings for local development with good debugging output
#
# Start with: geode serve --config configs/server/development.yaml

server:
  listen: "0.0.0.0:3141"
  metrics_listen: "0.0.0.0:9090"
  max_connections: 1000
  connection_timeout: "30s"
  idle_timeout: "5m"

storage:
  data_dir: "/var/lib/geode/data"
  wal_dir: "/var/lib/geode/wal"
  page_size: 8192
  page_cache_size: "1GB"
  wal_buffer_size: "16MB"
  wal_sync_interval: "100ms"
  compression: "zstd"

security:
  tde_enabled: false
  auth_enabled: false
  # TLS disabled for local development
  # Enable for secure development by uncommenting:
  # tls_cert_file: "/certs/server.crt"
  # tls_key_file: "/certs/server.key"

logging:
  level: "info"
  format: "text"
  # Enable query logging for debugging
  query_log_enabled: true
  query_log_threshold_ms: 100

monitoring:
  prometheus_enabled: true
  metrics_interval: "10s"

# Development-specific settings
debug:
  # Enable query explain output
  explain_enabled: true
  # Enable profile output
  profile_enabled: true
