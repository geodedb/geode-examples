# Security-Hardened Geode Configuration
# Maximum security settings for compliance-sensitive environments
# (GDPR, SOX, HIPAA, PCI-DSS)
#
# IMPORTANT: This configuration requires:
# - TDE key file or KMS configuration
# - TLS certificates
# - Properly configured user management
#
# Start with: geode serve --config configs/server/security-hardened.yaml

server:
  listen: "0.0.0.0:3141"
  metrics_listen: "127.0.0.1:9090"  # Metrics only on localhost
  max_connections: 5000
  connection_timeout: "15s"
  idle_timeout: "2m"

storage:
  data_dir: "/var/lib/geode/data"
  wal_dir: "/var/lib/geode/wal"
  page_size: 8192
  page_cache_size: "4GB"
  wal_buffer_size: "32MB"
  # Sync every write for maximum durability
  wal_sync_interval: "0ms"
  compression: "zstd"

security:
  # Transparent Data Encryption (mandatory)
  tde_enabled: true
  tde_algorithm: "AES-256-GCM"
  # Prefer Vault or AWS KMS for production
  tde_key_source: "vault"
  tde_vault_addr: "https://vault.internal:8200"
  tde_vault_path: "secret/data/geode/tde"
  tde_vault_role: "geode-server"

  # Field-Level Encryption for sensitive columns
  fle_enabled: true
  fle_key_source: "vault"

  # TLS configuration (mandatory)
  tls_cert_file: "/certs/server.crt"
  tls_key_file: "/certs/server.key"
  tls_ca_file: "/certs/ca.crt"
  tls_min_version: "1.3"
  # Require client certificates
  tls_client_auth: "require"

  # Authentication (mandatory)
  auth_enabled: true
  password_policy:
    min_length: 16
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special: true
    max_age_days: 60
    history_count: 12  # Cannot reuse last 12 passwords
    lockout_threshold: 5
    lockout_duration: "30m"

  # Multi-Factor Authentication
  mfa_enabled: true
  mfa_type: "totp"
  mfa_required_roles:
    - "admin"
    - "dba"

  # Row-Level Security
  rls_enabled: true
  rls_default_deny: true

  # Audit logging (mandatory for compliance)
  audit_enabled: true
  audit_log_path: "/var/log/geode/audit.log"
  audit_rotation: "daily"
  audit_retention: "365d"  # 1 year retention for compliance
  audit_events:
    - "authentication"
    - "authentication_failure"
    - "authorization"
    - "authorization_failure"
    - "query"
    - "query_failure"
    - "schema_change"
    - "admin"
    - "backup"
    - "restore"
    - "user_management"
  # Tamper-evident audit logs
  audit_signature_enabled: true
  audit_signature_key_file: "/certs/audit-signing.key"

  # Connection security
  connection_rate_limit: 100  # Per IP per minute
  max_failed_auth_attempts: 5

logging:
  level: "info"
  format: "json"
  output: "/var/log/geode/geode.log"
  rotation: "daily"
  retention: "90d"
  # Mask sensitive data in logs
  mask_sensitive: true

monitoring:
  prometheus_enabled: true
  metrics_interval: "30s"
  health_check_interval: "10s"
  # Require authentication for metrics endpoint
  metrics_auth_enabled: true
