// Seed data for the "10 Query Optimization Tips for Geode" example project.
// 500 Person nodes, 50 Company nodes, 20 Document nodes (for the vector
// index bonus tip), WORKS_AT/WORKS_WITH/KNOWS edges -- enough for every
// tip's query to return a real, non-trivial result.
//
// Deviations from the brief's original suggested seed (see FINDINGS.md
// for the full derivation of each):
//
// 1. UNWIND does not parse on this server at all (confirmed here and in
//    the why-quic-matters example project's FINDINGS.md) -- rewritten as
//    multi-pattern CREATE statements instead.
// 2. `WITH ... LIMIT ... CREATE` silently no-ops on this server (reports
//    success but creates nothing) -- edge counts below are bounded via a
//    WHERE-clause condition instead of a post-WITH LIMIT.
// 3. The brief's own KNOWS-bucketing idea (same mod-7 bucket, id delta
//    <= N) was tried first at delta<=21 and produced a "path power"
//    graph dense enough that Tip 3's *bounded* 1..3 hop Solution query
//    (`MATCH path = (start:Person)-[:KNOWS*1..3]-(end:Person) RETURN
//    path`) itself timed out after 30s server-side -- there are many
//    distinct paths between the same node pairs in a band/interval
//    graph, so bounding the hop count alone doesn't bound the path
//    *count*. Replaced with a single-chain structure (each person links
//    only to the *next* person in its bucket, delta == 7/11 exactly) --
//    still a real, connected, non-trivial graph, but with exactly one
//    path between any two nodes so 1..3 hop enumeration stays linear.
// 4. Added `department` and `state` properties to Person (needed for
//    Tip 5's `RETURN p.department, count(p)` and the "Denormalize When
//    Appropriate" bonus tip's `WHERE p.state = "California"`, neither of
//    which exists in the brief's minimal seed).
// 5. Added a WORKS_WITH relationship type (needed for Tip 8's
//    `[r:KNOWS|WORKS_WITH]` pattern, which has no WORKS_WITH edges to
//    match against without this).
// 6. Added 20 Document nodes with a 4-dimensional `embedding` list
//    property (needed for the "Use Vector Indexes for Similarity
//    Search" bonus tip -- there is no Document label at all in the
//    brief's minimal seed).

