apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geode.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "geode.labels" . | nindent 4 }}
data:
  geode.yaml: |
    # Geode Server Configuration
    # Generated by Helm chart

    server:
      listen: {{ .Values.config.server.listen | quote }}
      metrics_listen: {{ .Values.config.server.metricsListen | quote }}
      max_connections: {{ .Values.config.server.maxConnections }}
      connection_timeout: {{ .Values.config.server.connectionTimeout | quote }}
      idle_timeout: {{ .Values.config.server.idleTimeout | quote }}

    storage:
      data_dir: {{ .Values.config.storage.dataDir | quote }}
      wal_dir: {{ .Values.config.storage.walDir | quote }}
      page_size: {{ .Values.config.storage.pageSize }}
      page_cache_size: {{ .Values.config.storage.pageCacheSize | quote }}
      wal_buffer_size: {{ .Values.config.storage.walBufferSize | quote }}
      wal_sync_interval: {{ .Values.config.storage.walSyncInterval | quote }}
      compression: {{ .Values.config.storage.compression | quote }}

    security:
      tde_enabled: {{ .Values.config.security.tdeEnabled }}
      {{- if .Values.config.security.tlsEnabled }}
      tls_cert_file: {{ .Values.config.security.tlsCertFile | quote }}
      tls_key_file: {{ .Values.config.security.tlsKeyFile | quote }}
      {{- end }}
      auth_enabled: {{ .Values.config.security.authEnabled }}

    logging:
      level: {{ .Values.config.logging.level | quote }}
      format: {{ .Values.config.logging.format | quote }}

    monitoring:
      prometheus_enabled: {{ .Values.monitoring.enabled }}
