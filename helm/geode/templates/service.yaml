apiVersion: v1
kind: Service
metadata:
  name: {{ include "geode.fullname" . }}
  labels:
    {{- include "geode.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: quic
      protocol: UDP
      name: quic
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "geode.selectorLabels" . | nindent 4 }}
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geode.fullname" . }}-headless
  labels:
    {{- include "geode.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: quic
      protocol: UDP
      name: quic
  selector:
    {{- include "geode.selectorLabels" . | nindent 4 }}
