          query=$(cat "$f")
          docker compose exec -T geode sh -c "geode query --server localhost:3141 --ca-cert /data/server.crt -U geode -P \"\$GEODE_ADMIN_PASSWORD\" '$query'" || exit 1
        fi
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Client Library Tests
# =============================================================================

test:client:go:
  stage: test-clients
  image: golang:1.27.2
  extends: .geode-service
  script:
    - |
      if [ -f clients/go/go.mod ]; then
        cd clients/go
        go test -v ./... 2>&1 | tee ../../reports/go-tests.log
      else
        echo "Go client not configured, skipping"
      fi
  artifacts:
    paths:
      - reports/go-tests.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:client:python:
  stage: test-clients
  image: python:3.15
  extends: .geode-service
  script:
    - |
      if [ -f clients/python/requirements.txt ]; then
        pip install -r clients/python/requirements.txt
        cd clients/python
        pytest -v tests/ 2>&1 | tee ../../reports/python-tests.log
      else
        echo "Python client not configured, skipping"
      fi
  artifacts:
    paths:
      - reports/python-tests.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:client:rust:
  stage: test-clients
  image: rust:1.99
  extends: .geode-service
  script:
    - |
      if [ -f clients/rust/Cargo.toml ]; then
        cd clients/rust
        cargo test 2>&1 | tee ../../reports/rust-tests.log
      else
        echo "Rust client not configured, skipping"
      fi
  artifacts:
    paths:
      - reports/rust-tests.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:client:nodejs:
  stage: test-clients
  image: node:26-alpine
  extends: .geode-service
  script:
    - |
      if [ -f clients/nodejs/package.json ]; then
        cd clients/nodejs
        npm install
        npm test 2>&1 | tee ../../reports/nodejs-tests.log || true
        # Run examples as smoke test
        npm run basic 2>&1 | tee -a ../../reports/nodejs-tests.log || true
      else
        echo "Node.js client not configured, skipping"
      fi
  artifacts:
    paths:
      - reports/nodejs-tests.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:client:zig:
  stage: test-clients
  image: debian:trixie
  extends: .geode-service
  script:
    - apt-get update && apt-get install -y wget xz-utils
    - wget -q https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
    - tar -xf zig-x86_64-linux-0.16.0.tar.xz
    - export PATH="$PWD/zig-x86_64-linux-0.16.0:$PATH"
    - |
      if [ -f clients/zig/build.zig ]; then
        cd clients/zig
        zig build 2>&1 | tee ../../reports/zig-build.log
        zig build test 2>&1 | tee -a ../../reports/zig-tests.log || true
      else
        echo "Zig client not configured, skipping"
      fi
  artifacts:
    paths:
      - reports/zig-tests.log
      - reports/zig-build.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Feature Verification Tests
# =============================================================================

test:features:
  stage: test-features
  extends: .geode-service
  script:
    - mkdir -p reports
    - |
      if [ -d verification/claims/features ]; then
        python3 -m pytest verification/claims/features/ -v \
          --junitxml=reports/features.xml 2>&1 | tee reports/features.log
      else
        echo "Feature tests not configured, skipping"
      fi
  artifacts:
    reports:
      junit: reports/features.xml
    paths:
      - reports/features.log
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Performance Benchmarks
# =============================================================================

benchmark:throughput:
  stage: benchmark
  extends: .geode-service
  script:
    - mkdir -p reports
    - |
      if [ -f benchmarks/load-tests/read_only.py ]; then
        python3 benchmarks/load-tests/read_only.py \
          --duration 30 \
          --output reports/throughput.json
      else
        echo "Benchmark not configured, skipping"
        echo '{"status": "skipped"}' > reports/throughput.json
      fi
  artifacts:
    paths:
      - reports/throughput.json
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
  allow_failure: true

benchmark:latency:
  stage: benchmark
  extends: .geode-service
  script:
    - mkdir -p reports
    - |
      if [ -f benchmarks/load-tests/vector_distance.py ]; then
        python3 benchmarks/load-tests/vector_distance.py \
          --output reports/latency.json
      else
        echo "Benchmark not configured, skipping"
        echo '{"status": "skipped"}' > reports/latency.json
      fi
  artifacts:
    paths:
      - reports/latency.json
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
  allow_failure: true

