# Geode Examples - GitLab CI/CD Pipeline
#
# This pipeline verifies ALL claims made in geodedb.com documentation
# through automated testing against a black-box Geode instance.

# Fork protection: jobs here run on the privileged lab runner pool
# (host Docker socket), so never execute pipelines for MRs from forks —
# untrusted code must not reach privileged runners. Same-project MRs,
# main, tags, web and scheduled runs are unaffected.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
    when: never
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
    when: never
  # Stop redundant validation after a required failure on MRs/feature branches.
  # Keep default-branch and tag publication behavior unchanged.
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    auto_cancel:
      on_job_failure: all
  - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    auto_cancel:
      on_job_failure: all
  - when: always

  auto_cancel:
    on_new_commit: interruptible
stages:
- test-gql
- test-clients
- test-features
- benchmark
- security
- verify
- report
variables:
  # Pin the multi-platform manifest so verification does not change under a running MR.
  GEODE_IMAGE: geodedb/geode:latest@sha256:48a24f3739bda9017536cdd7b9b0c14474d0cc643d0b202560465d3834b9587a
  FF_NETWORK_PER_BUILD: 'true'
  GIT_DEPTH: '1'
  GOMAXPROCS: '2'
default:
  image: docker:29.9
  tags:
  - company
  - dedicated
  - linux
  - amd64
  interruptible: true
  before_script:
  - mkdir -p reports
check:query-runner:
  stage: test-gql
  image: python:3.15-slim
  tags: [company, linux, x86]
  before_script: []
  dependencies: []
  script:
  - python3 scripts/test_geode_response.py
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.geode-service:
  tags:
  - lab
  - linux
  - amd64
  variables:
    COMPOSE_FILE: $CI_PROJECT_DIR/docker/compose.ci.yml
  before_script:
  - apk add --no-cache make bash curl python3 py3-pip py3-pytest py3-pytest-asyncio py3-yaml
  - export COMPOSE_PROJECT_NAME="geode-examples-${CI_PROJECT_ID}-${CI_JOB_ID}"
  - mkdir -p reports
  - docker info >/dev/null
  - docker compose up -d --wait --wait-timeout 90 geode
  after_script:
  - export COMPOSE_PROJECT_NAME="geode-examples-${CI_PROJECT_ID}-${CI_JOB_ID}"
  - docker compose down --volumes --remove-orphans
  dependencies: []
test:client:go:
  stage: test-clients
  image: golang:1.27.3
  script:
  - make test-client-go
  artifacts:
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

  before_script:
  - mkdir -p reports
  dependencies: []
  variables:
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  cache:
    key:
      prefix: go-1.27.3-examples
      files:
      - clients/go/go.mod
    paths:
    - .cache/go-build/
    - .cache/go-mod/
test:client:python:
  stage: test-clients
  image: python:3.15
  script:
  - make test-client-python
  artifacts:
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

  before_script:
  - mkdir -p reports
  dependencies: []
test:client:rust:
  stage: test-clients
  image: rust:1.99
  script:
  - make test-client-rust
  artifacts:
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

  before_script:
  - mkdir -p reports
  dependencies: []
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
    CARGO_BUILD_JOBS: '2'
  cache:
    key:
      prefix: rust-1.99-examples
      files:
      - clients/rust/Cargo.toml
    paths:
    - .cache/cargo/registry/
    - .cache/cargo/git/
    - clients/rust/target/
test:client:nodejs:
  stage: test-clients
  image: node:26-alpine
  script:
  - make test-client-nodejs
  artifacts:
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

  before_script:
  - apk add --no-cache make bash
  - mkdir -p reports
  dependencies: []
test:client:zig:
  stage: test-clients
  image: debian:trixie
  script:
  - make test-client-zig
  artifacts:
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Feature Verification Tests
# =============================================================================

  before_script:
  - apt-get update && apt-get install -y --no-install-recommends make ca-certificates curl xz-utils
  - mkdir -p reports
  - |-
    mkdir -p .cache/zig-toolchain
    if [ ! -x .cache/zig-toolchain/zig ]; then
      curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o .cache/zig.tar.xz
      echo "$ZIG_LINUX_AMD64_SHA256  .cache/zig.tar.xz" | sha256sum -c -
      tar -xJf .cache/zig.tar.xz --strip-components=1 -C .cache/zig-toolchain
      rm .cache/zig.tar.xz
    fi
    export PATH="$PWD/.cache/zig-toolchain:$PATH"
    zig version | grep -Fx 0.16.0
  dependencies: []
  variables:
    ZIG_GLOBAL_CACHE_DIR: $CI_PROJECT_DIR/.cache/zig-global
    ZIG_LINUX_AMD64_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  cache:
    key: zig-0.16.0-examples-amd64
    paths:
    - .cache/zig-toolchain/
    - .cache/zig-global/
    - clients/zig/.zig-cache/
test:features:
  stage: test-features
  extends: .geode-service
  script:
  - make test-features
  artifacts:
    reports:
      junit: reports/features.xml
    paths:
    - reports/
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Performance Benchmarks
# =============================================================================

benchmark:throughput:
  stage: benchmark
  extends: .geode-service
  script:
  - mkdir -p reports
  - |
    if [ -f benchmarks/load-tests/read_only.py ]; then
      python3 benchmarks/load-tests/read_only.py \
        --duration 30 \
        --output reports/throughput.json
    else
      echo "Benchmark not configured, skipping"
      echo '{"status": "skipped"}' > reports/throughput.json
    fi
  artifacts:
    paths:
    - reports/throughput.json
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_COMMIT_BRANCH == "main"
  - when: manual
  allow_failure: true

benchmark:latency:
  stage: benchmark
  extends: .geode-service
  script:
  - mkdir -p reports
  - |
    if [ -f benchmarks/load-tests/vector_distance.py ]; then
      python3 benchmarks/load-tests/vector_distance.py \
        --output reports/latency.json
    else
      echo "Benchmark not configured, skipping"
      echo '{"status": "skipped"}' > reports/latency.json
    fi
  artifacts:
    paths:
    - reports/latency.json
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_COMMIT_BRANCH == "main"
  - when: manual
  allow_failure: true

# =============================================================================
# Security Tests
# =============================================================================

verify:extract-claims:
  stage: verify
  image: python:3.15-alpine
  script:
  - apk add --no-cache bash git
  - mkdir -p reports docs
  - |
    if [ -f verification/extractors/extract_claims.py ]; then
      python3 verification/extractors/extract_claims.py \
        --docs-path docs \
        --output reports/extracted_claims.json
    fi
  - |
    if [ -f verification/extractors/extract_gql_examples.py ]; then
      python3 verification/extractors/extract_gql_examples.py \
        --docs-path docs \
        --output-dir reports/extracted_gql \
        --list-only 2>&1 | tee reports/gql_examples.log
    fi
  artifacts:
    paths:
    - reports/extracted_claims.json
    - reports/extracted_gql/
    - reports/gql_examples.log
    when: always
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

  dependencies: []
verify:canary:
  stage: verify
  image: alpine:3.24
  script:
  - apk add --no-cache bash grep coreutils bc
  - mkdir -p docs
  - ./scripts/compare_canary.sh ../geode ../geodedb.com 2>&1 | tee docs/CANARY_CROSSREF.md || true
  artifacts:
    paths:
    - docs/CANARY_CROSSREF.md
    when: always
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# Report Generation
# =============================================================================

  dependencies: []
report:html:
  stage: report
  image: python:3.15-alpine
  script:
  - apk add --no-cache make bash jq bc
  - make report
  artifacts:
    paths:
    - public/
    expire_in: 30 days
  rules:
  - if: $CI_COMMIT_BRANCH == "main"

pages:
  interruptible: false
  stage: report
  # Publish the HTML report: without `needs`, this job got an EMPTY
  # public/ (its old cp was a self-referential no-op) and GitLab's
  # internal pages:deploy failed the whole pipeline with "include a
  # public/ folder in your artifacts".
  needs:
  - job: report:html
    artifacts: true
  script:
  - test -f public/index.html || { mkdir -p public; echo "<html><body>report:html produced no
    index</body></html>" > public/index.html; }
  artifacts:
    paths:
    - public
  rules:
  - if: $CI_COMMIT_BRANCH == "main"

  before_script: []
test:gql:
  stage: test-gql
  extends: .geode-service
  script:
  - make test-gql
  artifacts:
    paths:
    - reports/
    when: always
  rules: &id001
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
test:security:
  stage: security
  extends: .geode-service
  script:
  - make test-security
  artifacts:
    reports:
      junit: reports/security.xml
    paths:
    - reports/
    when: always
  rules: *id001
  allow_failure: true
