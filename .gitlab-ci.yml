# Geode Examples - GitLab CI/CD Pipeline
#
# This pipeline verifies ALL claims made in geodedb.com documentation
# through automated testing against a black-box Geode instance.

# Fork protection: jobs here run on the privileged lab runner pool
# (docker:dind), so never execute pipelines for MRs from forks —
# untrusted code must not reach privileged runners. Same-project MRs,
# main, tags, web and scheduled runs are unaffected.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: never
    - when: always

stages:
  - build
  - test-gql
  - test-clients
  - test-features
  - benchmark
  - security
  - verify
  - report
  - secret-detection

# Global variables
variables:
  GEODE_IMAGE: "geodedb/geode:latest"
  FF_NETWORK_PER_BUILD: "true"
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

# Default job configuration
default:
  image: docker:29.9
  # Socket-binding mode: the lab runners mount the host's
  # /var/run/docker.sock into every container (which is also why a dind
  # service can never bind its own socket there — "device or resource
  # busy"). Talk to the host daemon directly; no dind service.
  before_script:
    # Install packages only when the job can modify its image.
    - apk add --no-cache make bash curl 2>/dev/null || echo "skipping package install (non-root or non-alpine image)"
    - |
      # Only docker-based jobs need the daemon; report/utility jobs use
      # images without the docker CLI and must not fail this gate.
      if command -v docker >/dev/null 2>&1; then
        for i in $(seq 1 60); do
          if docker info >/dev/null 2>&1; then break; fi
          sleep 1
        done
        docker info >/dev/null 2>&1 || { echo "docker daemon never became ready"; exit 1; }
      fi
  # The lab runner pool mounts the host docker socket; keep these tags.
  # `amd64` targets the Lab Servers runner (haleth + lothiriel, host
  # docker.sock mounted). The Incus cluster runner, the only one carrying
  # `x86` + `lab`, has been paused since 2026-09-29, which left every job
  # here stuck_pending_no_matching_runners.
  tags: [company, lab, linux, amd64]
build:docker:
  stage: build
  script:
    # A previous job's crash-looping container (fixed container_name +
    # restart: unless-stopped) survives on the shared host daemon and
    # blocks/poisons this run — remove it first.
    - docker compose down -v --remove-orphans || true
    - docker compose build
    - docker compose up -d geode
    - sleep 10
    - docker compose exec -T geode sh -c 'geode query --server localhost:3141 --ca-cert /data/server.crt -U geode -P "$GEODE_ADMIN_PASSWORD" "RETURN 1"' || { docker compose ps; docker compose logs geode; exit 1; }
  after_script:
    # Never leave containers behind on the shared host daemon.
    - docker compose down -v --remove-orphans || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# GQL Compliance Tests
# =============================================================================

.geode-service:
  before_script:
    - apk add --no-cache make bash curl python3 py3-pip
    - pip3 install --break-system-packages pytest pytest-asyncio pyyaml
    - docker compose up -d geode
    - sleep 15
    - docker compose exec -T geode sh -c 'geode query --server localhost:3141 --ca-cert /data/server.crt -U geode -P "$GEODE_ADMIN_PASSWORD" "RETURN 1"' || (docker compose logs geode && exit 1)

test:gql:basic:
  stage: test-gql
  extends: .geode-service
  script:
    - echo "Running basic GQL tests..."
    - |
      for f in gql/basic/*.gql; do
        if [ -f "$f" ]; then
          echo "Testing $f..."
          query=$(cat "$f")
          docker compose exec -T geode sh -c "geode query --server localhost:3141 --ca-cert /data/server.crt -U geode -P \"\$GEODE_ADMIN_PASSWORD\" '$query'" || exit 1
        fi
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:gql:advanced:
  stage: test-gql
  extends: .geode-service
  script:
    - echo "Running advanced GQL tests..."
    - |
      for f in gql/advanced/*.gql; do
        if [ -f "$f" ]; then
          echo "Testing $f..."
          query=$(cat "$f")
          docker compose exec -T geode sh -c "geode query --server localhost:3141 --ca-cert /data/server.crt -U geode -P \"\$GEODE_ADMIN_PASSWORD\" '$query'" || exit 1
        fi
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

test:gql:transactions:
  stage: test-gql
  extends: .geode-service
  script:
    - echo "Running transaction GQL tests..."
    - |
      for f in gql/transactions/*.gql; do
        if [ -f "$f" ]; then
