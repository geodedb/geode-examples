# Geode Examples - Local Development Environment
#
# Usage:
#   docker compose up -d              # Start Geode server
#   docker compose up -d --build      # Rebuild and start
#   docker compose down               # Stop all services
#   docker compose logs -f geode      # Follow Geode logs
#
# Connect to Geode:
#   docker compose exec geode geode shell

services:
  # Geode Database Server
  geode:
    image: geodedb/geode:latest
    container_name: geode-server
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3141:3141"   # QUIC server port
      - "127.0.0.1:9090:9090"   # Prometheus metrics
    volumes:
      # /data is the directory the official image prepares (mkdir+chown
      # geode:geode, VOLUME) — the container runs as the non-root geode
      # user with cap_drop ALL, so any other mount point (e.g.
      # /var/lib/geode) is root-owned and unwritable, crash-looping the
      # server on "Can't open server.key for writing".
      - geode-data:/data
      - ./certs:/certs:ro
    environment:
      - GEODE_LOG_LEVEL=info
      - GEODE_DATA_DIR=/data
    command: ["serve", "--data-dir", "/data", "--listen", "0.0.0.0:3141", "--log-level", "info", "--disable-auth"]
    healthcheck:
      test: ["CMD", "geode", "query", "--server", "localhost:3141", "--ca-cert", "/data/server.crt", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - geode-network

  # Benchmark Runner
  benchmark:
    build:
      context: .
      dockerfile: docker/Dockerfile.benchmark
    image: geode-benchmark:latest
    container_name: geode-benchmark
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ./benchmarks:/benchmarks:ro
      - ./benchmarks/results:/results
    environment:
      - GEODE_HOST=geode:3141
    healthcheck:
      test: ["CMD-SHELL", "grep -q python /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - geode-network
    profiles:
      - benchmark

  # Test Harness
  test-harness:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-harness
    image: geode-test-harness:latest
    container_name: geode-test-harness
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ./gql:/workspace/gql:ro
      - ./verification:/workspace/verification:ro
      - ./clients:/workspace/clients:ro
      - ./reports:/workspace/reports
    environment:
      - GEODE_HOST=geode:3141
    healthcheck:
      test: ["CMD-SHELL", "grep -q run_all_tests /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - geode-network
    profiles:
      - test

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: geode-prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - geode-network
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:13.2.0
    container_name: geode-grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=geode
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - prometheus
    networks:
      - geode-network
    profiles:
      - monitoring

volumes:
  geode-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  geode-network:
    driver: bridge
