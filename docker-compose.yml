# Geode Examples - Local Development Environment
#
# Usage:
#   docker compose up -d              # Start Geode server
#   docker compose up -d --build      # Rebuild and start
#   docker compose down               # Stop all services
#   docker compose logs -f geode      # Follow Geode logs
#
# Connect to Geode:
#   docker compose exec geode geode shell

services:
  # Geode Database Server
  geode:
    image: registry.gitlab.com/devnw/codepros/geode/geode:latest
    container_name: geode-server
    ports:
      - "3141:3141"   # QUIC server port
      - "9090:9090"   # Prometheus metrics
    volumes:
      - geode-data:/var/lib/geode
      - geode-logs:/var/log/geode
      - ./certs:/certs:ro
    environment:
      - GEODE_LOG_LEVEL=info
      - GEODE_DATA_DIR=/var/lib/geode
    command: ["serve", "--data-dir", "/var/lib/geode", "--listen", "0.0.0.0:3141", "--log-level", "info", "--disable-auth"]
    healthcheck:
      test: ["CMD", "geode", "query", "--server", "localhost:3141", "--insecure", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - geode-network

  # Benchmark Runner
  benchmark:
    build:
      context: .
      dockerfile: docker/Dockerfile.benchmark
    image: geode-benchmark:latest
    container_name: geode-benchmark
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ./benchmarks:/benchmarks:ro
      - ./benchmarks/results:/results
    environment:
      - GEODE_HOST=geode:3141
    networks:
      - geode-network
    profiles:
      - benchmark

  # Test Harness
  test-harness:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-harness
    image: geode-test-harness:latest
    container_name: geode-test-harness
    depends_on:
      geode:
        condition: service_healthy
    volumes:
      - ./gql:/workspace/gql:ro
      - ./verification:/workspace/verification:ro
      - ./clients:/workspace/clients:ro
      - ./reports:/workspace/reports
    environment:
      - GEODE_HOST=geode:3141
    networks:
      - geode-network
    profiles:
      - test

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: geode-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - geode-network
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: geode-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=geode
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - geode-network
    profiles:
      - monitoring

volumes:
  geode-data:
    driver: local
  geode-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  geode-network:
    driver: bridge
