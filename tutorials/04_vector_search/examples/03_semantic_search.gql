-- Tutorial 4: Vector Search - Semantic Search
-- CANARY: REQ=REQ-VECTOR-SEMANTIC-001; FEATURE="SemanticSearch"; ASPECT=Tutorial; STATUS=TESTED

-- This example demonstrates a semantic search / RAG pattern
-- In production, embeddings would be generated by a model like sentence-transformers

-- ============================================
-- Setup: Knowledge Base
-- ============================================

-- Create articles with embeddings (8D for demo; real would be 384+)
CREATE (:Article {
    id: 'art1',
    title: 'What are Graph Databases?',
    content: 'Graph databases store data as nodes connected by relationships. They excel at traversing connected data.',
    embedding: vectorf32([0.9, 0.1, 0.2, 0.3, 0.1, 0.1, 0.2, 0.1])
});

CREATE (:Article {
    id: 'art2',
    title: 'GQL Query Language',
    content: 'GQL is the ISO standard query language for graph databases. It supports pattern matching and traversals.',
    embedding: vectorf32([0.85, 0.15, 0.25, 0.35, 0.1, 0.15, 0.25, 0.15])
});

CREATE (:Article {
    id: 'art3',
    title: 'Machine Learning Basics',
    content: 'Machine learning trains models on data to make predictions. Common types include supervised and unsupervised learning.',
    embedding: vectorf32([0.1, 0.9, 0.8, 0.1, 0.7, 0.1, 0.1, 0.6])
});

CREATE (:Article {
    id: 'art4',
    title: 'Neural Networks',
    content: 'Neural networks are computing systems inspired by biological brains. They consist of layers of interconnected nodes.',
    embedding: vectorf32([0.15, 0.85, 0.75, 0.15, 0.65, 0.15, 0.15, 0.55])
});

CREATE (:Article {
    id: 'art5',
    title: 'Graph Algorithms',
    content: 'Graph algorithms solve problems on graph structures. Common algorithms include PageRank, shortest path, and community detection.',
    embedding: vectorf32([0.8, 0.2, 0.3, 0.4, 0.2, 0.2, 0.3, 0.2])
});

-- ============================================
-- Semantic Search
-- ============================================

-- Query: "How do I query connected data?"
-- Query embedding (would be generated by same model as article embeddings)
WITH vectorf32([0.88, 0.12, 0.23, 0.32, 0.11, 0.13, 0.22, 0.12]) AS question_embedding

-- Find relevant articles
MATCH (a:Article)
WITH a, cosineSimilarity(a.embedding, question_embedding) AS relevance
WHERE relevance > 0.8
ORDER BY relevance DESC
LIMIT 3

RETURN a.title, round(relevance, 3) AS relevance, a.content;

-- ============================================
-- RAG Pattern: Retrieve Context for LLM
-- ============================================

-- Step 1: Encode user question (done externally)
-- "What is a graph database and how does GQL work?"
WITH vectorf32([0.87, 0.13, 0.24, 0.33, 0.11, 0.12, 0.23, 0.13]) AS question_embedding

-- Step 2: Retrieve relevant context
MATCH (a:Article)
WITH a, cosineSimilarity(a.embedding, question_embedding) AS score
WHERE score > 0.75
ORDER BY score DESC
LIMIT 3

-- Step 3: Return context for LLM
WITH collect({
    title: a.title,
    content: a.content,
    relevance: round(score, 3)
}) AS context

RETURN context;

-- The context would be passed to an LLM to generate an answer

-- ============================================
-- Multi-Query Retrieval
-- ============================================

-- Sometimes splitting a complex question helps
-- "Compare graph databases with machine learning approaches"

WITH [
    vectorf32([0.85, 0.15, 0.25, 0.35, 0.12, 0.14, 0.24, 0.14]),  -- graph database aspect
    vectorf32([0.12, 0.88, 0.78, 0.12, 0.68, 0.12, 0.12, 0.58])   -- ML aspect
] AS query_vectors

UNWIND query_vectors AS query_embedding
MATCH (a:Article)
WITH DISTINCT a, max(cosineSimilarity(a.embedding, query_embedding)) AS best_score
WHERE best_score > 0.7
ORDER BY best_score DESC
RETURN a.title, round(best_score, 3) AS relevance;

-- ============================================
-- Contextual Filtering
-- ============================================

-- Add categories for filtering
MATCH (a:Article)
WHERE a.title CONTAINS 'Graph' OR a.title CONTAINS 'GQL'
SET a.category = 'database';

MATCH (a:Article)
WHERE a.title CONTAINS 'Machine' OR a.title CONTAINS 'Neural'
SET a.category = 'ml';

-- Search only within a category
WITH vectorf32([0.88, 0.12, 0.23, 0.32, 0.11, 0.13, 0.22, 0.12]) AS question_embedding
MATCH (a:Article)
WHERE a.category = 'database'
WITH a, cosineSimilarity(a.embedding, question_embedding) AS relevance
ORDER BY relevance DESC
LIMIT 3
RETURN a.title, a.category, round(relevance, 3) AS relevance;

-- ============================================
-- Cleanup
-- ============================================
MATCH (n) DETACH DELETE n;
