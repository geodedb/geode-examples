[package]
name = "geode-examples-rust"
version = "0.1.0"
edition = "2021"
description = "Rust client examples for Geode graph database"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "basic_usage"
path = "examples/basic_usage/main.rs"

[[example]]
name = "high_throughput"
path = "examples/high_throughput/main.rs"

[[example]]
name = "connection_pool"
path = "examples/connection_pool/main.rs"

[[example]]
name = "transactions"
path = "examples/transactions/main.rs"
