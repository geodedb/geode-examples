-- GQL Transaction Example 004: Common Transaction Patterns
-- CANARY: REQ=REQ-TXN-PATTERN-001; FEATURE="TransactionPatterns"; ASPECT=BestPractices; STATUS=TESTED
--
-- This example demonstrates common transaction patterns.
-- Source: Transaction Tutorial

-- Pattern 1: Atomic Transfer (All or Nothing)
START TRANSACTION;

-- Both statements use the same eligibility check within one transaction.
-- With insufficient funds or a missing destination, neither statement writes.
MATCH (source:Account {name: 'Alice'}), (dest:Account {name: 'Bob'})
WHERE source.balance >= 200
CREATE (:Transfer {
    from: source.name,
    to: dest.name,
    amount: 200,
    timestamp: timestamp()
});

MATCH (source:Account {name: 'Alice'}), (dest:Account {name: 'Bob'})
WHERE source.balance >= 200
SET source.balance = source.balance - 200,
    dest.balance = dest.balance + 200;

COMMIT;

-- Pattern 2: Read-Modify-Write with Optimistic Locking
START TRANSACTION;

MATCH (a:Account {name: 'Alice'})
WHERE a.version = 1
SET a.balance = a.balance + 50,
    a.version = a.version + 1;

COMMIT;

-- Pattern 3: Batch Insert
START TRANSACTION;

CREATE (:Product {name: 'Product1', price: 100});
CREATE (:Product {name: 'Product2', price: 200});
CREATE (:Product {name: 'Product3', price: 300});

-- Create inventory records
-- Give existing records the same per-product key used by MERGE, without
-- changing their quantities. A label-only MERGE could reuse another product's stock.
MATCH (p:Product)-[:HAS_INVENTORY]->(inventory:Inventory)
SET inventory.product_id = id(p);

MATCH (p:Product)
MERGE (p)-[:HAS_INVENTORY]->(:Inventory {product_id: id(p)});

-- Initialize new inventory without resetting quantities on existing records.
MATCH (p:Product)-[:HAS_INVENTORY]->(inventory:Inventory)
WHERE inventory.quantity IS NULL
SET inventory.quantity = 0;

COMMIT;

-- Pattern 4: Conditional Commit
START TRANSACTION;

MATCH (o:Order {id: 'ORD001'})
SET o.status = 'processing';

-- Only commit if order total is valid
MATCH (o:Order {id: 'ORD001'})
WHERE o.total > 0
WITH o
SET o.processed_at = timestamp();

COMMIT;

-- Verify patterns worked
MATCH (t:Transfer)
RETURN t.from, t.to, t.amount;
