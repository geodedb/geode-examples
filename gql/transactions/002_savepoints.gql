-- GQL Transaction Example 002: Savepoints
-- CANARY: REQ=REQ-TXN-SAVE-001; FEATURE="Savepoints"; ASPECT=PartialRollback; STATUS=TESTED
--
-- This example demonstrates savepoint operations.
-- Verifies claim: "Savepoints for partial rollback"
-- Source: Features Overview

-- Create base data and add first item in one transaction
START TRANSACTION;
CREATE (:Order {id: 'ORD001', status: 'pending', total: 0});
CREATE (:Item {id: 'ITEM001', name: 'Widget', price: 50});
MATCH (o:Order {id: 'ORD001'}), (i:Item {id: 'ITEM001'})
CREATE (o)-[:CONTAINS {quantity: 2}]->(i);
COMMIT;

-- Calculate total and complete
START TRANSACTION;
MATCH (o:Order {id: 'ORD001'})-[c:CONTAINS]->(i:Item)
WITH o, SUM(c.quantity * i.price) AS calculated_total
SET o.total = calculated_total, o.status = 'confirmed';
COMMIT;

-- Verify: Order should only contain Widget
MATCH (o:Order {id: 'ORD001'})-[c:CONTAINS]->(i:Item)
RETURN o.id, o.status, o.total, i.name, c.quantity;

-- Separate transactions example
START TRANSACTION;
CREATE (:Test {level: 1});
COMMIT;

START TRANSACTION;
CREATE (:Test {level: 2});
ROLLBACK;

-- Only level 1 test should exist
MATCH (t:Test)
RETURN t.level;
