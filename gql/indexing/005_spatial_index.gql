-- GQL Indexing Example 005: Spatial Index (R-tree)
-- CANARY: REQ=REQ-INDEX-SPATIAL-001; FEATURE="SpatialIndex"; ASPECT=Indexing; STATUS=TESTED
--
-- This example demonstrates R-tree spatial index for geographic queries.
-- Verifies claim: "R-tree spatial index (geographic queries)"
-- Source: Features Overview, Indexing Tutorial

-- Create locations with coordinates
CREATE (:Location {
    name: 'Empire State Building',
    coords: latlon(40.7484, -73.9857)
});

CREATE (:Location {
    name: 'Statue of Liberty',
    coords: latlon(40.6892, -74.0445)
});

CREATE (:Location {
    name: 'Central Park',
    coords: latlon(40.7829, -73.9654)
});

CREATE (:Location {
    name: 'Brooklyn Bridge',
    coords: latlon(40.7061, -73.9969)
});

CREATE (:Location {
    name: 'Times Square',
    coords: latlon(40.7580, -73.9855)
});

-- Create R-tree spatial index
CREATE INDEX location_coords_spatial ON Location(coords) USING spatial_geographic;

-- Haversine distance is returned in meters; convert displayed values to kilometers.
-- Find locations within 5 kilometers
WITH latlon(40.7484, -73.9857) AS reference
MATCH (l:Location)
WHERE distance_haversine(l.coords, reference) < 5000
RETURN l.name, distance_haversine(l.coords, reference) / 1000.0 AS distance_km
ORDER BY distance_km;

-- Find locations within bounding box
MATCH (l:Location)
WHERE latitude(l.coords) >= 40.70 AND latitude(l.coords) <= 40.80
  AND longitude(l.coords) >= -74.00 AND longitude(l.coords) <= -73.95
RETURN l.name, l.coords;

-- Find nearest N locations
WITH latlon(40.7580, -73.9855) AS times_square
MATCH (l:Location)
RETURN l.name, distance_haversine(l.coords, times_square) / 1000.0 AS distance_km
ORDER BY distance_km
LIMIT 3;

-- Haversine distance calculation
WITH latlon(40.7484, -73.9857) AS empire_state
MATCH (l:Location)
WHERE l.name <> 'Empire State Building'
RETURN l.name, distance_haversine(l.coords, empire_state) / 1000.0 AS haversine_km
ORDER BY haversine_km;

-- Explain spatial query
EXPLAIN
WITH latlon(40.7484, -73.9857) AS reference
MATCH (l:Location)
WHERE distance_haversine(l.coords, reference) < 5000
RETURN l.name;
