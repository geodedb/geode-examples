-- GQL Advanced Example 001: WITH Clause (Pipeline Stages)
-- CANARY: REQ=REQ-GQL-WITH-001; FEATURE="WithClause"; ASPECT=QueryExecution; STATUS=TESTED
--
-- This example demonstrates the WITH clause for query pipelines.
-- Verifies claim: "Subqueries and CTEs (WITH clauses)"
-- Source: Features Overview

-- Basic WITH for variable passing
MATCH (p:Person)
WHERE p.age > 25
WITH p
MATCH (p)-[:KNOWS]->(friend:Person)
RETURN p.name, friend.name;

-- WITH for aggregation intermediate result
MATCH (p:Person)-[:KNOWS]->(friend:Person)
WITH p, COUNT(friend) AS friend_count
WHERE friend_count > 1
RETURN p.name, friend_count
ORDER BY friend_count DESC;

-- WITH for filtering after aggregation
MATCH (p:Person)
WITH p.city AS city, COUNT(p) AS population
WHERE population > 1
RETURN city, population
ORDER BY population DESC;

-- Multiple WITH clauses (pipeline)
MATCH (p:Person)
WITH p, p.age AS age
WHERE age > 25
WITH p, age, p.city AS city
RETURN p.name, age, city
ORDER BY age;

-- WITH DISTINCT for deduplication
MATCH (p:Person)-[:KNOWS]->(friend:Person)
WITH DISTINCT friend
RETURN friend.name
ORDER BY friend.name;

-- WITH for ordering before limiting
MATCH (p:Person)
WITH p
ORDER BY p.age DESC
LIMIT 3
RETURN p.name, p.age;
