-- GQL Advanced Example 003: Subqueries
-- CANARY: REQ=REQ-GQL-SUBQ-001; FEATURE="Subqueries"; ASPECT=QueryExecution; STATUS=TESTED
--
-- This example demonstrates subqueries and EXISTS patterns.
-- Verifies claim: "Subqueries and CTEs (WITH clauses)"
-- Source: Features Overview

-- EXISTS subquery: Find people who have friends
MATCH (p:Person)
WHERE EXISTS {
    MATCH (p)-[:KNOWS]->(:Person)
}
RETURN p.name AS has_friends;

-- NOT EXISTS: Find people without friends
MATCH (p:Person)
WHERE NOT EXISTS {
    MATCH (p)-[:KNOWS]->(:Person)
}
RETURN p.name AS no_friends;

-- EXISTS with condition
MATCH (p:Person)
WHERE EXISTS {
    MATCH (p)-[:KNOWS]->(friend:Person)
    WHERE friend.age > 30
}
RETURN p.name AS has_older_friends;

-- Correlated filter pattern: find people older than city average
MATCH (p:Person)
MATCH (other:Person)
WHERE other.city = p.city
WITH p, AVG(other.age) AS city_avg
WHERE p.age > city_avg
RETURN p.name, p.age, p.city;

-- Count-based filter: find people with more than one friend
MATCH (p:Person)-[:KNOWS]->(friend:Person)
WITH p, COUNT(friend) AS friend_count
WHERE friend_count > 1
RETURN p.name AS popular_people;
