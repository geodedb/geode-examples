-- GQL Use Case: Fraud Detection Patterns
-- CANARY: REQ=REQ-USECASE-FRAUD-001; FEATURE="FraudDetection"; ASPECT=UseCase; STATUS=TESTED
--
-- This example demonstrates fraud detection patterns from the documentation.
-- Source: Use Cases - Fraud Detection

-- ============================================================================
-- SETUP: Create Financial Transaction Data
-- ============================================================================

-- Create accounts
CREATE (a1:Account {id: 'acc1', name: 'Alice Corp', balance: 100000, type: 'business'});
CREATE (a2:Account {id: 'acc2', name: 'Bob LLC', balance: 50000, type: 'business'});
CREATE (a3:Account {id: 'acc3', name: 'Carol Inc', balance: 75000, type: 'business'});
CREATE (a4:Account {id: 'acc4', name: 'Suspicious Ltd', balance: 10000, type: 'business'});
CREATE (a5:Account {id: 'acc5', name: 'Offshore Holdings', balance: 500000, type: 'offshore'});

-- Create transactions
MATCH (from:Account {id: 'acc1'}), (to:Account {id: 'acc2'})
CREATE (from)-[:TRANSFER {
    id: 'tx1',
    amount: 15000,
    timestamp: datetime('2026-01-15T10:30:00Z'),
    currency: 'USD'
}]->(to);

MATCH (from:Account {id: 'acc2'}), (to:Account {id: 'acc3'})
CREATE (from)-[:TRANSFER {
    id: 'tx2',
    amount: 14500,
    timestamp: datetime('2026-01-15T10:35:00Z'),
    currency: 'USD'
}]->(to);

MATCH (from:Account {id: 'acc3'}), (to:Account {id: 'acc1'})
CREATE (from)-[:TRANSFER {
    id: 'tx3',
    amount: 14000,
    timestamp: datetime('2026-01-15T10:40:00Z'),
    currency: 'USD'
}]->(to);

-- Suspicious pattern: rapid layering
MATCH (from:Account {id: 'acc4'}), (to:Account {id: 'acc5'})
CREATE (from)-[:TRANSFER {
    id: 'tx4',
    amount: 9999,
    timestamp: datetime('2026-01-15T11:00:00Z'),
    currency: 'USD'
}]->(to);

MATCH (from:Account {id: 'acc4'}), (to:Account {id: 'acc5'})
CREATE (from)-[:TRANSFER {
    id: 'tx5',
    amount: 9998,
    timestamp: datetime('2026-01-15T11:01:00Z'),
    currency: 'USD'
}]->(to);

MATCH (from:Account {id: 'acc4'}), (to:Account {id: 'acc5'})
CREATE (from)-[:TRANSFER {
    id: 'tx6',
    amount: 9997,
    timestamp: datetime('2026-01-15T11:02:00Z'),
    currency: 'USD'
}]->(to);

-- ============================================================================
-- FRAUD DETECTION QUERIES
-- ============================================================================

-- 1. Circular Transaction Detection (Money Laundering Ring)
-- Find money flowing in a circle back to origin
MATCH (a:Account)-[t:TRANSFER*3..6]->(a)
RETURN
    a.name AS origin,
    length(t) AS hops,
    [n IN nodes(t) | n.name] AS accounts_involved;

-- 2. Structuring Detection (Smurfing)
-- Multiple transactions just under reporting threshold ($10,000)
MATCH (a:Account)-[t:TRANSFER]->(b:Account)
WHERE t.amount >= 9000 AND t.amount < 10000
WITH a, COUNT(t) AS suspicious_count, SUM(t.amount) AS total
WHERE suspicious_count >= 2
RETURN
    a.name AS account,
    suspicious_count AS transactions_near_threshold,
    total AS total_amount
ORDER BY suspicious_count DESC;

-- 3. Rapid Layering Detection
-- Multiple transfers in short time window
MATCH (a:Account)-[t1:TRANSFER]->(b:Account)-[t2:TRANSFER]->(c:Account)
WHERE t2.timestamp > t1.timestamp
  AND t2.timestamp < t1.timestamp + duration({minutes: 30})
  AND t1.amount > 10000
  AND t2.amount > 10000
RETURN
    a.name AS source,
    b.name AS intermediary,
    c.name AS destination,
    t1.amount AS amount1,
    t2.amount AS amount2,
    t1.timestamp AS time1,
    t2.timestamp AS time2;

-- 4. Unusual Destination Analysis
-- Transfers to offshore or high-risk accounts
MATCH (a:Account)-[t:TRANSFER]->(offshore:Account {type: 'offshore'})
RETURN
    a.name AS sender,
    offshore.name AS offshore_destination,
    SUM(t.amount) AS total_to_offshore,
    COUNT(t) AS transfer_count
GROUP BY a.name, offshore.name
ORDER BY total_to_offshore DESC;

-- 5. Velocity Analysis
-- Accounts with unusual transaction frequency
MATCH (a:Account)-[t:TRANSFER]->()
WITH a, COUNT(t) AS tx_count, SUM(t.amount) AS total_out
WHERE tx_count > 2
RETURN
    a.name AS account,
    tx_count AS outgoing_transfers,
    total_out AS total_amount,
    total_out / tx_count AS avg_per_transfer
ORDER BY tx_count DESC;

-- 6. First-Party Fraud Detection
-- Self-transfers or related party transactions
MATCH (a:Account)-[t:TRANSFER]->(b:Account)
WHERE a.name CONTAINS b.name OR b.name CONTAINS a.name
RETURN
    a.name AS sender,
    b.name AS receiver,
    t.amount AS amount,
    'Potential self-dealing' AS flag;

-- 7. Network Analysis - Find connected suspicious accounts
MATCH (suspicious:Account {type: 'offshore'})<-[:TRANSFER*1..3]-(connected:Account)
RETURN DISTINCT
    connected.name AS connected_account,
    connected.type AS account_type
ORDER BY connected.name;

-- 8. Aggregate Risk Score
MATCH (a:Account)
OPTIONAL MATCH (a)-[out:TRANSFER]->()
OPTIONAL MATCH ()-[in:TRANSFER]->(a)
WITH a,
     COUNT(DISTINCT out) AS out_count,
     COUNT(DISTINCT in) AS in_count,
     COALESCE(SUM(out.amount), 0) AS total_out,
     COALESCE(SUM(in.amount), 0) AS total_in
RETURN
    a.name AS account,
    out_count AS outgoing,
    in_count AS incoming,
    total_out,
    total_in,
    CASE
        WHEN a.type = 'offshore' THEN 'HIGH'
        WHEN total_out > 50000 THEN 'MEDIUM'
        ELSE 'LOW'
    END AS risk_level
ORDER BY risk_level, total_out DESC;
